<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="vla://_/bridge.js"></script>
<style>
  :root { --bg: #1f1f1e; --surface: #2a2a29; --border: #3a3a39; --text: #e8e8e8; --muted: #a1a1a0; --accent: #d97757; --ok: #6dc198; }
  html, body { margin: 0; background: transparent; color: var(--text); font-family: var(--font, 'JetBrains Mono', monospace); }
  .wrap { padding: 18px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
  .row { display: flex; gap: 8px; justify-content: center; margin: 18px 0 8px; flex-wrap: wrap; }
  .cell { width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
          background: var(--bg); border: 1px solid var(--border); font-weight: 700; transition: all .25s; }
  .cell.out { opacity: .25; }
  .cell.mid { background: var(--accent); color: #fff; border-color: transparent; transform: translateY(-4px); }
  .cell.found { background: var(--ok); color: #fff; border-color: transparent; }
  .idx { display: flex; gap: 8px; justify-content: center; font-size: 11px; color: var(--muted); }
  .idx span { width: 46px; text-align: center; }
  .bar { display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; border: none; border-radius: 999px; padding: 8px 16px; cursor: pointer; background: var(--accent); color: #fff; font-weight: 700; }
  button.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
  input { font: inherit; width: 70px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .msg { text-align: center; margin-top: 14px; color: var(--muted); min-height: 1.4em; }
  .msg b { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><label>目标 <input id="target" value="23"></label><button id="step">下一步</button><button id="reset" class="ghost">重置</button><button id="ask" class="ghost">问 AI</button></div>
  <div class="row" id="cells"></div>
  <div class="idx" id="idx"></div>
  <div class="msg" id="msg">点「下一步」开始。</div>
</div>
<script>
  const a = [2, 5, 8, 12, 16, 23, 38, 56, 71, 90];
  let lo, hi, done, steps;
  const $ = id => document.getElementById(id);
  function reset() { lo = 0; hi = a.length - 1; done = false; steps = 0; draw(-1); $('msg').textContent = '点「下一步」开始。'; }
  function draw(mid, found) {
    $('cells').innerHTML = a.map((v, i) => `<div class="cell ${i < lo || i > hi ? 'out' : ''} ${i === mid ? (found ? 'found' : 'mid') : ''}">${v}</div>`).join('');
    $('idx').innerHTML = a.map((_, i) => `<span>${i === lo ? 'lo' : i === hi ? 'hi' : i}</span>`).join('');
  }
  $('step').onclick = async () => {
    if (done) return;
    const x = Number($('target').value);
    if (lo > hi) { done = true; $('msg').innerHTML = `区间空了：<b>${x}</b> 不在数组里（${steps} 步）。`; return; }
    const mid = lo + ((hi - lo) >> 1);
    steps++;
    if (a[mid] === x) {
      done = true; draw(mid, true);
      $('msg').innerHTML = `找到了！a[${mid}] = <b>${x}</b>，用了 <b>${steps}</b> 步。`;
      const state = (await vla.getState()) || {};
      await vla.setState({ ...state, found: (state.found || 0) + 1 });
      vla.complete();
      return;
    }
    draw(mid);
    if (a[mid] < x) { $('msg').innerHTML = `a[${mid}] = ${a[mid]} &lt; ${x}，扔掉左半边：lo = ${mid + 1}`; lo = mid + 1; }
    else { $('msg').innerHTML = `a[${mid}] = ${a[mid]} &gt; ${x}，扔掉右半边：hi = ${mid - 1}`; hi = mid - 1; }
  };
  $('reset').onclick = reset;
  $('ask').onclick = () => vla.ask('二分查找每一步为什么能放心地扔掉一半？');
  reset();
  vla.ready().then(info => {
    if (info && info.state && info.state.found) $('msg').textContent = `你之前已经成功找到过 ${info.state.found} 次。`;
  });
</script>
</body>
</html>
